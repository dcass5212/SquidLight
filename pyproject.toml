[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rgbapp"
version = "0.0.1"
description = "Personal Synapse-style RGB lighting controller (OpenRGB SDK backend)"
requires-python = ">=3.11"
dependencies = [
    "openrgb-python",
    "numpy",
    "psutil",
]

[project.optional-dependencies]
# Added when their milestones start (M2 and M7).
gui = ["PySide6", "pytest-qt"]
audio = ["sounddevice"]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["rgbapp*"]

[tool.setuptools.package-data]
"rgbapp" = ["layouts/*.json"]
"rgbapp.ui" = ["assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
